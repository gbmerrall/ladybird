<!DOCTYPE html>
<script src="include.js"></script>
<script>
  asyncTest(async done => {
    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();
    device.onuncapturederror = event => println("uncaptured: " + event.error.constructor.name + ": " + event.error.message);

    const module = device.createShaderModule({
      code: `
        @group(0) @binding(0) var<storage, read_write> data: array<u32>;
        @compute @workgroup_size(4) fn double(@builtin(global_invocation_id) id: vec3u) {
          data[id.x] = data[id.x] * 2u;
        }
        @compute @workgroup_size(4) fn square(@builtin(global_invocation_id) id: vec3u) {
          data[id.x] = data[id.x] * data[id.x];
        }`,
    });
    const double = device.createComputePipeline({ layout: "auto", compute: { module, entryPoint: "double" } });
    const square = await device.createComputePipelineAsync({ layout: "auto", compute: { module, entryPoint: "square" } });
    println("async pipeline: " + square.constructor.name);

    const data = device.createBuffer({ size: 32, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(data, 0, new Uint32Array([1, 2, 3, 4, 5, 6, 7, 8]));
    const indirect = device.createBuffer({ size: 12, usage: GPUBufferUsage.INDIRECT | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(indirect, 0, new Uint32Array([1, 1, 1]));
    const readable = device.createBuffer({ size: 32, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });

    // Double all eight values, then square the first four through an indirect dispatch.
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginComputePass();
    pass.setPipeline(double);
    pass.setBindGroup(0, device.createBindGroup({ layout: double.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: data } }] }));
    pass.dispatchWorkgroups(2);
    pass.setPipeline(square);
    pass.setBindGroup(0, device.createBindGroup({ layout: square.getBindGroupLayout(0), entries: [{ binding: 0, resource: data }] }));
    pass.dispatchWorkgroupsIndirect(indirect, 0);
    pass.end();
    encoder.copyBufferToBuffer(data, readable);
    device.queue.submit([encoder.finish()]);
    await readable.mapAsync(GPUMapMode.READ);
    println("results: " + Array.from(new Uint32Array(readable.getMappedRange())).join(","));
    readable.unmap();

    try {
      await device.createComputePipelineAsync({ layout: "auto", compute: { module, entryPoint: "missing" } });
      println("FAIL: a pipeline with a missing entry point was made");
    } catch (error) {
      println("a missing entry point: " + error.name);
    }
    done();
  });
</script>
